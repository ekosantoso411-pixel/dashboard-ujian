<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ujian</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Kiri (Nomor Soal) */
        .sidebar {
            width: 250px;
            background-color: #fff;
            padding: 20px;
            border-right: 1px solid #ccc;
            overflow-y: auto;
        }
        
        .sidebar-header {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1em;
            color: #333;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .number-btn {
            width: 35px;
            height: 35px;
            border: 1px solid #ccc;
            border-radius: 50%;
            background-color: #fff;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
        }
        
        .number-btn:hover {
            background-color: #eee;
        }
        
        /* Status Warna Nomor Soal */
        .number-btn.answered {
            background-color: #4CAF50; /* Hijau - Sudah dijawab */
            color: white;
            border: none;
        }
        
        .number-btn.current {
            background-color: #2196F3; /* Biru - Soal saat ini */
            color: white;
            border: none;
        }
        
        .number-btn.marked {
            background-color: #FFC107; /* Kuning - Ragu-ragu */
            color: black;
            border: none;
        }

        /* Area Konten Utama */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Atas (Biru) */
        .header {
            background-color: #1A4EB1;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left .title {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .header-left .subtitle {
            font-size: 0.8em;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* Area Soal */
        .question-area {
            padding: 20px;
            background-color: #f4f4f4;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        /* Bar Info (Nomor Soal & Ragu-ragu) */
        .info-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-box {
            background-color: #fff;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            flex: 1;
        }
        
        .info-box.warning {
            background-color: #FFF9E6;
            border-color: #FFE082;
            color: #d89000;
        }

        .font-sizer {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .font-sizer span {
            cursor: pointer;
            font-weight: bold;
        }
        .font-sizer span:nth-child(1) { font-size: 14px; }
        .font-sizer span:nth-child(2) { font-size: 18px; }
        .font-sizer span:nth-child(3) { font-size: 22px; }

        /* Konten Soal Aktual */
        .question-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 5px;
            border: 1px solid #ddd;
            min-height: 400px;
        }
        
        .instruction {
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .question-title {
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        
        .question-text {
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: justify;
        }

        /* Placeholder Gambar */
        .image-placeholder {
            width: 100%;
            max-width: 600px;
            height: 300px;
            border: 1px solid #ccc;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            background-color: #fafafa;
        }
        
        .question-prompt {
            margin-top: 20px;
            font-style: italic;
        }

    </style>
</head>
<body>

    <!-- Sidebar Kiri: Navigasi Nomor Soal -->
    <div class="sidebar">
        <div class="sidebar-header">Daftar Soal</div>
        <div class="number-grid" id="numberGrid">
            <div style="grid-column: span 5; font-size: 12px; color: #666;">Memuat soal...</div>
        </div>
    </div>

    <!-- Area Utama Kanan -->
    <div class="main-content">
        
        <!-- Header Biru -->
        <div class="header">
            <div class="header-left">
                <div class="title">AP 1</div>
                <div class="subtitle">KOMPUTER CLIENT [21-010-2026 08:25:27]</div>
            </div>
        </div>

        <!-- Area Konten Soal -->
        <div class="question-area">
            
            <!-- Bar Info Atas -->
            <div class="info-bar">
                <div class="info-box">
                    <div id="infoSoalText" style="font-weight: bold; color: #555;">Memuat...</div>
                    <div class="font-sizer">
                        <span title="Ukuran teks kecil">A</span>
                        <span title="Ukuran teks sedang">A</span>
                        <span title="Ukuran teks besar">A</span>
                    </div>
                </div>
                <div class="info-box warning">
                    &#9888; Jika ragu dengan jawabanmu, kamu bisa menandainya
                </div>
            </div>

            <!-- Kertas Soal -->
            <div class="question-content">
                <div class="instruction">Perhatikan informasi berikut!</div>
                
                <div class="question-title" id="judulSoal">Tunggu sebentar...</div>
                
                <div class="question-text" id="teksSoal">
                    Sedang memuat data soal...
                </div>
                
                <!-- Tempat Gambar Silsilah -->
                <div class="image-placeholder" id="gambarSoal">
                    [Area Gambar]
                </div>
                
                <div class="question-prompt" id="promptSoal">
                    Pilih jawaban yang benar berdasarkan teks di atas.
                </div>
            </div>
            
        </div>
    </div>
    
<script>
    const sheetURL = "https://script.google.com/macros/s/AKfycbx3vUiqsJ1w9jtydoPIurfspwZqBlvLYSs7Ux_aoA_EyJRw2OJtyDn67wsYCKk7sH6A/exec";
    
    let bankSoal = []; 
    let indexSoalAktif = 0; 

    // Fungsi untuk mengambil data soal
    async function ambilDataSoal() {
        try {
            // Mencoba mengambil dari Google Sheet
            const response = await fetch(sheetURL);
            
            if (!response.ok) {
                throw new Error("Jaringan bermasalah atau akses ditolak");
            }
            
            bankSoal = await response.json();
            
        } catch (error) {
            console.warn("Gagal mengambil dari Google Sheet (mungkin CORS/Fetch diblokir). Memuat data cadangan (Dummy Data)...");
            
            // DATA CADANGAN JIKA ERROR
            bankSoal = [
                {
                    Judul: "PEWARISAN GOLONGAN DARAH DALAM KELUARGA",
                    Teks: "Golongan darah merupakan salah satu sifat yang dapat diwariskan dari orang tua kepada anak. Pewarisan golongan darah dikendalikan oleh alel ganda pada sistem ABO yang melibatkan tiga alel, yaitu I<sup>A</sup>, I<sup>B</sup>, dan I<sup>O</sup>.<br><br>Untuk mempelajari pola pewarisan golongan darah dalam suatu keluarga, dilakukan pencatatan golongan darah beberapa anggota selama dua generasi.",
                    Gambar: "https://placehold.co/600x300/f0f0f0/999999?text=Gambar+Silsilah+Keluarga"
                },
                {
                    Judul: "SISTEM EKSKRESI",
                    Teks: "Ginjal adalah organ utama dalam sistem ekskresi manusia yang berfungsi menyaring darah. Nefron merupakan unit fungsional terkecil dari ginjal.",
                    Gambar: ""
                },
                {
                    Judul: "HUKUM NEWTON II",
                    Teks: "Percepatan yang ditimbulkan oleh gaya yang bekerja pada suatu benda berbanding lurus dengan besar gaya dan berbanding terbalik dengan massa benda.",
                    Gambar: "https://placehold.co/400x200/f0f0f0/999999?text=Diagram+Gaya"
                },
                {
                    Judul: "SOAL NOMOR 4",
                    Teks: "Ini adalah teks percobaan untuk memastikan bahwa sistem navigasi tombol soal nomor 4 berfungsi dengan baik.",
                    Gambar: ""
                },
                {
                    Judul: "SOAL NOMOR 5",
                    Teks: "Ini adalah teks soal terakhir dari contoh data cadangan (dummy). Anda bisa klik nomor 1 untuk kembali.",
                    Gambar: ""
                }
            ];
        }

        if (bankSoal && bankSoal.length > 0) {
            buatTombolNavigasi(); 
            tampilkanSoal(0);     
        } else {
            document.getElementById('teksSoal').innerHTML = "Data soal kosong.";
        }
    }

    // Fungsi untuk membuat tombol navigasi secara otomatis
    function buatTombolNavigasi() {
        const grid = document.getElementById('numberGrid');
        grid.innerHTML = ''; // Kosongkan area grid

        bankSoal.forEach((soal, index) => {
            const btn = document.createElement('button');
            btn.className = 'number-btn';
            btn.innerText = index + 1; // Nomor urut mulai dari 1
            
            // Ketika tombol diklik, panggil fungsi tampilkanSoal dengan index yang sesuai
            btn.onclick = () => tampilkanSoal(index);
            
            grid.appendChild(btn);
        });
    }

    // Fungsi untuk menyuntikkan data ke dalam HTML berdasarkan nomor yang diklik
    function tampilkanSoal(index) {
        indexSoalAktif = index;
        const soal = bankSoal[index];

        // 1. Update teks "Soal X dari Y" di info-bar atas
        document.getElementById('infoSoalText').innerText = `Soal ${index + 1} dari ${bankSoal.length}`;

        // 2. Memasukkan Judul Soal
        document.getElementById('judulSoal').innerText = soal.Judul || "";
        
        // 3. Memasukkan Teks Soal
        document.getElementById('teksSoal').innerHTML = soal.Teks || "";
        
        // 4. Memasukkan Gambar (jika ada)
        const imagePlaceholder = document.getElementById('gambarSoal');
        if(soal.Gambar && soal.Gambar.trim() !== "") {
            imagePlaceholder.style.display = 'flex'; // Munculkan kotaknya
            imagePlaceholder.innerHTML = `<img src="${soal.Gambar}" style="max-width: 100%; max-height: 100%; object-fit: contain;" alt="Gambar Soal">`;
        } else {
            imagePlaceholder.style.display = 'none'; // Sembunyikan jika tidak ada gambar
        }

        // 5. Update warna tombol yang sedang aktif (biru)
        updateWarnaTombol();
    }

    // Fungsi untuk mengubah warna tombol yang sedang aktif
    function updateWarnaTombol() {
        const semuaTombol = document.querySelectorAll('.number-btn');
        semuaTombol.forEach((btn, index) => {
            // Hapus class 'current' dari semua tombol
            btn.classList.remove('current');
            
            // Tambahkan class 'current' hanya ke tombol soal yang sedang aktif
            if (index === indexSoalAktif) {
                btn.classList.add('current');
            }
        });
    }

    // Jalankan fungsi saat halaman pertama kali dibuka
    window.onload = ambilDataSoal;
</script>
</body>
</html>
